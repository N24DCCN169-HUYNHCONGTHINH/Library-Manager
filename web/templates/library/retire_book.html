{% extends "base.html" %}{% block content %}<section class="card personal-card"><h1>Ngừng sử dụng đầu sách</h1><h2>{{ book.title }}</h2><p>Đầu sách sẽ ẩn khỏi tra cứu công khai. Các bản sách và lịch sử giao dịch vẫn được giữ để tra soát. Có thể khôi phục bằng cách bật lại “Đang sử dụng”.</p><form method="post">{% csrf_token %}<label for="retire-reason">Lý do</label><input id="retire-reason" name="reason" required maxlength="300"><button class="btn btn-danger">Xác nhận ngừng sử dụng</button></form><a href="{% url 'library:book_edit' book.pk %}">Quay lại</a></section>{% endblock %}
