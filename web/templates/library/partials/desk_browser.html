<aside class="card desk-browser" id="desk-browser" data-browser-url="{% url 'library:desk_browser' %}"><div class="desk-browser-heading"><span class="eyebrow">TRA CỨU TẠI QUẦY</span><h2>Chọn độc giả & bản sách</h2><p class="muted">Chọn để điền mã. Chỉ ghi giao dịch khi bạn bấm xác nhận.</p></div><form method="get" action="{% url 'library:circulation_desk' %}" data-desk-browser-form><input type="hidden" name="tab" value="{{ active_tab }}"><label for="desk-browser-kind">Danh sách</label><select id="desk-browser-kind" name="desk_kind">{% for kind in desk_allowed_kinds %}<option value="{{ kind }}" {% if desk_kind == kind %}selected{% endif %}>{% if kind == 'readers' %}Độc giả{% elif kind == 'copies' %}Bản sách{% else %}Sách đang mượn{% endif %}</option>{% endfor %}</select><label for="desk-browser-query">Tên độc giả, tên sách hoặc mã</label><input id="desk-browser-query" name="desk_q" type="search" data-lookup="{{ desk_kind }}" data-lookup-mode="filter" value="{{ desk_query }}" placeholder="Lọc danh sách ngay tại đây…" autocomplete="off"><div class="desk-browser-filter"><label for="desk-browser-status">Tình trạng bản sách</label><select id="desk-browser-status" name="desk_status"><option value="all">Tất cả tình trạng</option><option value="available" {% if desk_status == 'available' %}selected{% endif %}>Sẵn sàng</option><option value="on_loan" {% if desk_status == 'on_loan' %}selected{% endif %}>Đang mượn</option></select></div><button type="submit" class="btn btn-outline-primary">Lọc danh sách</button></form><p class="desk-browser-selection" data-desk-selected aria-live="polite"></p><p class="desk-browser-feedback" data-desk-browser-status role="status"></p><noscript>Danh sách vẫn xem được; bật JavaScript để chọn và tự điền mã.</noscript><div data-desk-browser-results>{% include 'library/partials/desk_browser_results.html' %}</div></aside>
