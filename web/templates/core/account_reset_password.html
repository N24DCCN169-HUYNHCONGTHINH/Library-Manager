{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu · Library Hub{% endblock %}
{% block content %}
<section class="card personal-card">
  <h1>Đặt lại mật khẩu</h1>
  <p>Tài khoản <strong>@{{ subject.username }}</strong> sẽ dùng mật khẩu tạm và phải đổi ở lần đăng nhập tiếp theo.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Xác nhận đặt mật khẩu tạm</button>
  </form>
  <a href="{% url 'account_detail' subject.pk %}">Quay lại hồ sơ tài khoản</a>
</section>
{% endblock %}
